name: PHP CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint all PHP
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find . -type f -name '*.php' -print0)
      - name: Legacy direction/config logic
        run: php tests/test_logic.php
      - name: Module loader contracts
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          modules=[]
          for p in Path('.').glob('*/module.json'):
              data=json.loads(p.read_text(encoding='utf-8'))
              php=p.with_name('module.php')
              if not php.exists():
                  raise SystemExit(f'Missing module.php for {p}')
              src=php.read_text(encoding='utf-8')
              m=re.search(r'class\s+([A-Za-z0-9_]+)\s+extends\s+IPSModule', src)
              if not m:
                  raise SystemExit(f'No IPSModule class in {php}')
              expected=re.sub(r'[^A-Za-z0-9_]', '', data['name'])
              if m.group(1) != expected:
                  raise SystemExit(f'Loader class mismatch: {p}: expected {expected}, got {m.group(1)}')
              modules.append((str(p), data['prefix']))
          prefixes={}
          for p,prefix in modules:
              if prefix in prefixes:
                  raise SystemExit(f'Duplicate module prefix {prefix}: {prefixes[prefix]} and {p}')
              prefixes[prefix]=p
          print('Module loader contracts PASS')
          PY
      - name: P03 proof simulations
        run: php tests/P03ProofEngineTest.php
      - name: P03 auxiliary Human IVS rule tests
        run: php tests/P03AuxHumanRuleTest.php
      - name: P03 hardened module contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('JVPresenceP03TerraceTest/module.php').read_text(encoding='utf-8')
          required=[
            "evaluateTwoCameraSequence",
            "P03 PRODUKTIV – 2-Kamera-Sequenz",
            "p03AuxStreamsReady",
            "p03AuxTransportState",
            "waitForP03AuxStream",
            "inspectP03AuxIvsRuntime",
            "p03CredentialsReady",
            "P03AuxHumanRule::matches",
            "CrossRegionDetection",
            "ObjectTypes=Human",
            "restoreP03AuxHumanRule",
            "cleanupLegacyTerraceP03Config",
            "if ($auditOnly) {",
            "$this->ResetTest();"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing hardened P03 contracts: '+repr(missing))
          forbidden=[
              "ALA2_Reconnect",
              "ALA2_MODULE_GUID",
              "{5E08D4EE-9727-4682-A23E-E8625EB2337E}"
          ]
          leaked=[x for x in forbidden if x in s]
          if leaked:
              raise SystemExit('P03 still depends on AussenlichtAutomatik2: '+repr(leaked))
          observer=Path('JVPresenceP03AuxObserver/module.php').read_text(encoding='utf-8')
          observer_required=[
              "class JVPresenceP03AuxObserver extends IPSModule",
              "RuleIndex",
              "RuleID",
              "RuleName",
              "PersonDetected",
              "LastIVSEvent",
              "DahuaDigest::buildAuthorization",
              "P03AuxObserverLogic::isHumanProofStart"
          ]
          observer_missing=[x for x in observer_required if x not in observer]
          if observer_missing:
              raise SystemExit('Missing independent aux observer contracts: '+repr(observer_missing))
          observer_logic=Path('libs/P03AuxObserverLogic.php').read_text(encoding='utf-8')
          for token in ["CrossRegionDetection", "isHumanProofStart", "isMatchingRuleEvent"]:
              if token not in observer_logic:
                  raise SystemExit('Missing aux observer logic contract: '+token)
          if "ReadPropertyInteger('RuleID')" not in observer:
              raise SystemExit('Aux observer does not match events using Dahua RuleID')
          rule=Path('libs/P03AuxHumanRule.php').read_text(encoding='utf-8')
          for token in [
              "'Action' => ['Cross', 'Appear']",
              "'Direction' => 'Enter'",
              "in_array('Appear', $actions, true)",
              "'CalibrateBoxs'",
              "'TimeSection'",
              "has24x7Schedule",
              "'LightingLink'",
              "'MsgtoNetEnable'"
          ]:
              if token not in rule:
                  raise SystemExit('Missing functional CrossRegion rule contract: '+token)
          parser=Path('libs/DahuaEventParser.php').read_text(encoding='utf-8')
          for token in ["'CfgRuleId'", "'RuleID'", "'RuleId'", "'ruleName'", "'ruleIds'", "array_key_exists($key, $node)"]:
              if token not in parser:
                  raise SystemExit('Missing Dahua parser identity contract: '+token)
          audit=s[s.index("public function PrepareAndStartTest"):s.index("private function rollbackPreparedP03Config")]
          if audit.index("if ($auditOnly) {") > audit.index("$this->ResetTest();"):
              raise SystemExit('Audit-only guard does not protect field evidence')
          if "WriteAttributeBoolean('ProductionEnabled', false)" not in audit:
              raise SystemExit('Audit/test preparation does not disable production fail-safe')

          pending=s[s.index("private function evaluateP03Pending"):s.index("private function evaluateP03MastSequence")]
          if "commitP03VerifiedResult" in pending:
              raise SystemExit('Legacy CrossLine pending path can still commit a transfer')

          crossing=s[s.index("private function recordP03Crossing"):s.index("public function P03AuxRescan")]
          for forbidden_token in ["commitP03VerifiedResult", "setP03PendingCrossings($pending)", "evaluateP03Pending()"]:
              if forbidden_token in crossing:
                  raise SystemExit('Terrace CrossLine still affects proof: '+forbidden_token)

          process=s[s.index("private function processEventData"):s.index("public function P03ProofTimer")]
          if "recordP03HumanEvent(P03ProofEngine::SRC_TERRACE" in process:
              raise SystemExit('Terrace Human still enters transfer evidence buffer')

          verified=s[s.index("private function commitP03VerifiedResult"):s.index("private function checkP03CommissioningComplete")]
          if "SetValue('CrossingCount', $verified)" not in verified:
              raise SystemExit('Visible crossing count is not tied to verified mast transfers')

          reset=s[s.index("public function ResetTest"):s.index("public function CleanupCameraTestConfig")]
          if "WriteAttributeBoolean('ProductionEnabled', false)" not in reset:
              raise SystemExit('ResetTest does not disable production')

          print('P03 hardened module contract PASS')
          PY
