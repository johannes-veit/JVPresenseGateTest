name: PHP CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint all PHP
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find . -type f -name '*.php' -print0)
      - name: Legacy direction/config logic
        run: php tests/test_logic.php
      - name: Module loader contracts
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          modules=[]
          for p in Path('.').glob('*/module.json'):
              data=json.loads(p.read_text(encoding='utf-8'))
              php=p.with_name('module.php')
              if not php.exists():
                  raise SystemExit(f'Missing module.php for {p}')
              src=php.read_text(encoding='utf-8')
              m=re.search(r'class\s+([A-Za-z0-9_]+)\s+extends\s+IPSModule', src)
              if not m:
                  raise SystemExit(f'No IPSModule class in {php}')
              expected=re.sub(r'[^A-Za-z0-9_]', '', data['name'])
              if m.group(1) != expected:
                  raise SystemExit(f'Loader class mismatch: {p}: expected {expected}, got {m.group(1)}')
              modules.append((str(p), data['prefix']))
          prefixes={}
          for p,prefix in modules:
              if prefix in prefixes:
                  raise SystemExit(f'Duplicate module prefix {prefix}: {prefixes[prefix]} and {p}')
              prefixes[prefix]=p
          print('Module loader contracts PASS')
          PY
      - name: P03 proof simulations
        run: php tests/P03ProofEngineTest.php
      - name: P03 auxiliary Human IVS rule tests
        run: php tests/P03AuxHumanRuleTest.php
      - name: P03 observer HTTP/Digest/Eventstream integration simulation
        run: php tests/P03AuxObserverStreamTest.php
      - name: P03 one-click read-only socket diagnosis
        run: php tests/P03ConnectionDiagnosisTest.php
      - name: P03 Symcon Create and ApplyChanges registration safety
        run: php tests/P03RegistrationLifecycleTest.php
      - name: Dahua IPC-HFW5442E-ZE 2.840 model config and wire security unit
        run: php tests/P03IPC5442AuditTest.php
      - name: P03 dedicated Client Socket creation/connection simulation
        run: php tests/P03ClientSocketRepairTest.php
      - name: P03 hardened module contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main=Path('JVPresenceP03TerraceTest/module.php').read_text(encoding='utf-8')
          gate=Path('JVPresenceGateTest/module.php').read_text(encoding='utf-8')
          observer=Path('JVPresenceP03AuxObserver/module.php').read_text(encoding='utf-8')
          rule=Path('libs/P03AuxHumanRule.php').read_text(encoding='utf-8')
          parser=Path('libs/DahuaEventParser.php').read_text(encoding='utf-8')
          digest=Path('libs/DahuaDigest.php').read_text(encoding='utf-8')
          logic=Path('libs/P03AuxObserverLogic.php').read_text(encoding='utf-8')
          template=Path('libs/P03DahuaTemplate.php').read_text(encoding='utf-8')

          required_main=[
              "evaluateTwoCameraSequence",
              "P03 PRODUKTIV – 2-Kamera-Sequenz",
              "p03AuxStreamsReady",
              "getP03AuxNativeCrossRegionTemplate",
              "P03AuxHumanRule::buildFromTemplate",
              "P03AuxHumanRule::matches",
              "restoreP03AuxHumanRule",
              "restoreLegacyTerraceP03Config",
              "AuxJVEventCounterVarID",
              "AuxWorkEventCounterVarID",
              "TerraceDiagnosticsEnabled",
              "matchesP03TerraceRuleEvent",
              "JVP03DahuaEventParser::feed",
              "JVP03DahuaDigest::",
              "if ($auditOnly) {",
              "$this->ResetTest();"
          ]
          missing=[x for x in required_main if x not in main]
          if missing:
              raise SystemExit('Missing hardened P03 contracts: '+repr(missing))

          forbidden=[
              "ALA2_Reconnect",
              "ALA2_MODULE_GUID",
              "{5E08D4EE-9727-4682-A23E-E8625EB2337E}"
          ]
          leaked=[x for x in forbidden if x in main or x in observer]
          if leaked:
              raise SystemExit('P03 still depends on AussenlichtAutomatik2: '+repr(leaked))

          # Critical isolation: AussenlichtAutomatik2 owns global classes with
          # these names. P03 must never declare or call them.
          if "final class DahuaDigest" in digest or "final class DahuaEventParser" in parser:
              raise SystemExit('P03 helper classes still collide globally with AussenlichtAutomatik2')
          import re
          if re.search(r'(?<!JVP03)DahuaDigest::', main) or re.search(r'(?<!JVP03)DahuaDigest::', observer):
              raise SystemExit('P03 still calls shared DahuaDigest class')
          if re.search(r'(?<!JVP03)DahuaEventParser::', main) or re.search(r'(?<!JVP03)DahuaEventParser::', observer):
              raise SystemExit('P03 still calls shared DahuaEventParser class')
          if "final class JVP03DahuaDigest" not in digest or "final class JVP03DahuaEventParser" not in parser:
              raise SystemExit('Unique P03 Dahua helper classes missing')

          # P05 must use the same repository-isolated helpers; otherwise the
          # v0.6.9 rename leaves the Schiebetor module broken at runtime.
          if "JVP03DahuaDigest::" not in gate or "JVP03DahuaEventParser::" not in gate:
              raise SystemExit('P05 gate module still references obsolete Dahua helper class names')

          # The P03 main module has no live parent interface anymore. Its two
          # internal mast observers own their own sockets. A closed optional
          # terrace parent must never put the P03 main instance into error.
          import json
          p03meta=json.loads(Path('JVPresenceP03TerraceTest/module.json').read_text(encoding='utf-8'))
          if p03meta.get('parentRequirements') not in ([], None):
              raise SystemExit('P03 main module still declares a parent requirement')
          if p03meta.get('implemented') not in ([], None):
              raise SystemExit('P03 main module still implements a parent data interface')
          if "RequireParent(" in main:
              raise SystemExit('P03 main module still calls RequireParent')
          if "disconnectLegacyParentSocket" not in main or "IPS_DisconnectInstance" not in main:
              raise SystemExit('P03 update does not detach legacy parent socket')

          observer_required=[
              "class JVPresenceP03AuxObserver extends IPSModule",
              "expectedRuleName",
              "RuleIndex",
              "RuleID",
              "PersonDetected",
              "HumanEventCounter",
              "JVP03DahuaDigest::buildAuthorization",
              "P03AuxObserverLogic::isHumanProofStart"
          ]
          observer_missing=[x for x in observer_required if x not in observer]
          if observer_missing:
              raise SystemExit('Missing independent aux observer contracts: '+repr(observer_missing))

          # The aux observer must never get stuck with StreamOK=false after an
          # ApplyChanges/reconnect. Reset the staged restart state and keep the
          # same handshake-timeout recovery used by the proven ALA2 stream.
          apply_obs=observer[observer.index("public function ApplyChanges"):observer.index("public function GetConfigurationForParent")]
          for token in [
              "WriteAttributeInteger('SocketRestartStage', 0)",
              "WriteAttributeInteger('LastHttpRequest', 0)"
          ]:
              if token not in apply_obs:
                  raise SystemExit('Aux observer ApplyChanges does not reset restart state: '+token)
          create_obs=observer[observer.index("public function Create"):observer.index("public function ApplyChanges")]
          for ident in ["ParsedEventCount","CrossRegionEventCount","RuleMatchEventCount","DedupeRejectCount","RuleRejectCount"]:
              if ("RegisterAttributeInteger('"+ident+"', 0)") not in create_obs:
                  raise SystemExit('P03 audit attribute missing in legal Create registration: '+ident)
              if ("RegisterAttributeInteger('"+ident+"', 0)") in apply_obs:
                  raise SystemExit('Illegal duplicate observer attribute registration in ApplyChanges: '+ident)
          for token in ["RegisterVariableString('EventAudit'", "isFreshDelivery(", "recordEventAudit("]:
              if token not in observer:
                  raise SystemExit('P03 v0.6.19 event diagnosis/dedupe missing: '+token)
          for token in [
              "public function RestoreP03Observers(): void",
              "'id' => 57215, 'socket' => 17785",
              "'id' => 27938, 'socket' => 55478",
              "IPS_SetProperty($id, 'CameraHost'",
              "IPS_ApplyChanges($id)",
              "count($targets) !== 2",
              "P03RestoreSummary"
          ]:
              if token not in main:
                  raise SystemExit('P03 v0.6.22 restoration safety contract missing: '+token)
          if observer.count("RegisterAttributeInteger('WireCodeCount', 0)") != 1:
              raise SystemExit('Observer WireCodeCount must be registered ONCE, in Create only')
          if observer.count("RegisterAttributeInteger('WireHeartbeatCount', 0)") != 1:
              raise SystemExit('Observer WireHeartbeatCount must be registered ONCE, in Create only')
          if main.count("RegisterTimer('P03MastHealthTimer'") != 1:
              raise SystemExit('Main P03 health timer must be registered ONCE, in Create only')
          # Full IPC5442 dump must be genuinely complete, in P03-owned
          # document media, and must advertise media IDs via known #35115.
          for token in [
              "public function DiagnoseIPC5442AllValues(): void",
              "public function DiagnoseIPC5442Configuration(): void",
              "protected function writeP03PrivateDocument(",
              "IPS_CreateMedia(5)",
              "IPS_SetMediaContent($id,base64_encode($content))",
              "getConfig&name=All",
              "Config.backup?action=All",
              "P03ConnectionDiagnosis"
          ]:
              if token not in main:
                  raise SystemExit('P03 full device config export contract missing: '+token)
          model_audit=(root/'libs/P03IPC5442Audit.php').read_text()
          for token in [
              "public static function exportAllValues(",
              "private static function mustMaskFullValue(",
              "NICHT ABGESCHNITTEN: JA"
          ]:
              if token not in model_audit:
                  raise SystemExit('Full device config audit security/completeness contract missing: '+token)
          # A failed module-index search must never zero out the last
          # stored P03 observer identity, and stored StreamOK must not
          # make an orphaned observer count as healthy.
          for token in [
              "public function DiagnoseP03Ownership(): void",
              "private function matchesTrustedP03Observer(",
              "array_map('intval', IPS_GetInstanceList())",
              "if ($jv > 0)",
              "if ($work > 0)",
              "if (!$this->p03AuxStreamsReady())"
          ]:
              if token not in main:
                  raise SystemExit('P03 v0.6.21 lost-observer fail-safe missing: '+token)
          reconnect_obs=observer[observer.index("public function Reconnect"):observer.index("private function processEventData")]
          if "WriteAttributeInteger('SocketRestartStage', 0)" not in reconnect_obs:
              raise SystemExit('Aux observer Reconnect cannot recover a stale restart stage')
          watchdog_obs=observer[observer.index("public function Watchdog"):observer.index("public function PersonPulseTimer")]
          # v0.6.18 requires direct age-based HealthTick, not old timer-only restarts.
          for token in [
              "public function HealthTick(): string",
              "LastHealthTick", "LastHealthAction", "$lastRequest", "> 12",
              "WriteAttributeBoolean(\'Streaming\', false)",
              "SetValue(\'StreamOK\', false)", "StartSocketNow()",
              "hasExclusiveParentSocket", "LastSocketRestart"
          ]:
              if token not in watchdog_obs:
                  raise SystemExit("Aux observer health/fresh-TCP recovery contract missing: "+token)
          if "public function P03MastHealthTimer(): void" not in main or "JVP03AUX_HealthTick" not in main:
              raise SystemExit("Independent P03-main mast health timer missing")
          # Explicitly DO NOT apply parent changes from ApplyChanges:
          # the documented RequireParent+GetConfigurationForParent lifecycle
          # must own the configuration until staged Digest socket reconnect.
          if "ensureParentSocketConfigured()" in observer:
              raise SystemExit('Aux observer still applies Client Socket during ApplyChanges')
          if "ObserverStatus" not in observer or "refreshObserverStatus" not in observer:
              raise SystemExit('Aux observer diagnostics missing')
          if "GetConfigurationForParent" not in observer or "scheduleSocketRestart(500)" not in apply_obs:
              raise SystemExit('P03 dedicated Client Socket startup/reconnect missing')

          for token in ["ruleName", "cfgRuleId", "ruleIdUpper", "ruleIdLower"]:
              if token not in parser:
                  raise SystemExit('Parser does not preserve Dahua rule identity field: '+token)

          for token in ["wantedName", "wantedIndex", "wantedId", "isHumanProofStart", "isMatchingRuleEvent"]:
              if token not in logic:
                  raise SystemExit('Missing aux identity logic contract: '+token)

          for token in ["buildFromTemplate", "'Appear'", "'Both'", "firmware-specific"]:
              if token not in rule:
                  raise SystemExit('Missing native-template Human IVS contract: '+token)

          for token in ["crossRegionFromFlat", "findCrossRegion", "Rule.Normal.CrossRegionDetection"]:
              if token not in template:
                  raise SystemExit('Missing Dahua native-template parser contract: '+token)

          if "P03AuxHumanRule::build(" in main:
              raise SystemExit('Unsafe hand-built aux IVS rule path still present')

          if "/cgi-bin/VideoInAnalyse.cgi?action=getTemplateRule&Channel=1&Class=Normal" not in main:
              raise SystemExit('Correct Dahua VideoInAnalyse getTemplateRule endpoint missing')
          if "/cgi-bin/devVideoAnalyse.cgi?action=getTemplateRule" in main:
              raise SystemExit('Obsolete/wrong devVideoAnalyse getTemplateRule endpoint present')
          reconnect=main[main.index("private function reconnectP03AuxObserver"):main.index("private function getP03AuxNativeCrossRegionTemplate")]
          for token in ["CameraHost", "CameraPort", "Username", "Password", "Role", "RuleIndex", "RuleID"]:
              if ("IPS_SetProperty($instanceID, '" + token + "'") not in reconnect:
                  raise SystemExit('P03 audit does not synchronize aux observer property: '+token)

          # Read-only mast audit: never force unrelated Dahua SMD/MotionDetect
          # or touch legacy terrace / AussenlichtAutomatik2.
          if "readP03AuxHumanAiStatus" not in main:
              raise SystemExit('Read-only Dahua SMD status helper missing')
          if "inspectP03AuxHumanRuleReadOnly" not in main:
              raise SystemExit('Read-only Dahua IVS checker missing')
          if "ensureP03AuxHumanAiEnabled(" in main:
              raise SystemExit('Dangerous SMD/MD auto-enabling function present')
          for forbidden_write in [
              "SmartMotionDetect[0].Enable=true",
              "SmartMotionDetect[0].ObjectTypes.Human=true",
              "MotionDetect[0].Enable=true"
          ]:
              if forbidden_write in main:
                  raise SystemExit('P03 audit still forces unrelated camera AI: ' + forbidden_write)
          if "$legacyCleanup = $this->restoreLegacyTerraceP03Config();" in main:
              raise SystemExit('Mast audit still modifies legacy terrace camera')

          # Existing aux instances must gain new variables on module update.
          apply=observer[observer.index("public function ApplyChanges"):observer.index("public function GetConfigurationForParent")]
          if "RegisterVariableInteger('HumanEventCounter'" not in apply:
              raise SystemExit('Existing aux observers do not migrate HumanEventCounter in ApplyChanges')

          audit=main[main.index("public function PrepareAndStartTest"):main.index("private function rollbackPreparedP03Config")]
          if audit.index("if ($auditOnly) {") > audit.index("$this->ResetTest();"):
              raise SystemExit('Audit-only guard does not protect field evidence')
          for forbidden_token in [
              "createP03TripwireViaRpc2(",
              "auditP03CameraConfiguration(",
              "setNormalVideoAnalyseSensitivityViaRpc2("
          ]:
              if forbidden_token in audit:
                  raise SystemExit('Standard mast audit/test still configures terrace IVS: '+forbidden_token)

          ready=main[main.index("private function refreshReadyState"):main.index("private function setStreamOK")]
          if "AuxJVEventCounterVarID" not in ready or "AuxWorkEventCounterVarID" not in ready:
              raise SystemExit('Readiness is not driven by both mast event counters')
          for forbidden_token in ["ReadAttributeBoolean('Streaming')", "ReadAttributeInteger('RuleIndex')"]:
              if forbidden_token in ready:
                  raise SystemExit('Terrace still gates mast readiness: '+forbidden_token)

          production=main[main.index("public function EnableProductionP03"):main.index("public function DisableProductionP03")]
          if "AuxJVEventCounterVarID" not in production or "AuxWorkEventCounterVarID" not in production:
              raise SystemExit('Production does not require both mast event counters')
          if "AuxJVPersonVarID') > 0" in production or "AuxWorkPersonVarID') > 0" in production:
              raise SystemExit('Production still gates on visible PersonDetected booleans')

          print('P03 hardened module contract PASS')
          PY
