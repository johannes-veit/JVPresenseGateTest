name: PHP CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint all PHP
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            php -l "$f"
          done < <(find . -type f -name '*.php' -print0)
      - name: Legacy direction/config logic
        run: php tests/test_logic.php
      - name: Module loader contracts
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          modules=[]
          for p in Path('.').glob('*/module.json'):
              data=json.loads(p.read_text(encoding='utf-8'))
              php=p.with_name('module.php')
              if not php.exists():
                  raise SystemExit(f'Missing module.php for {p}')
              src=php.read_text(encoding='utf-8')
              m=re.search(r'class\s+([A-Za-z0-9_]+)\s+extends\s+IPSModule', src)
              if not m:
                  raise SystemExit(f'No IPSModule class in {php}')
              expected=re.sub(r'[^A-Za-z0-9_]', '', data['name'])
              if m.group(1) != expected:
                  raise SystemExit(f'Loader class mismatch: {p}: expected {expected}, got {m.group(1)}')
              modules.append((str(p), data['prefix']))
          prefixes={}
          for p,prefix in modules:
              if prefix in prefixes:
                  raise SystemExit(f'Duplicate module prefix {prefix}: {prefixes[prefix]} and {p}')
              prefixes[prefix]=p
          print('Module loader contracts PASS')
          PY
      - name: P03 proof simulations
        run: php tests/P03ProofEngineTest.php
      - name: P03 hardened module contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('JVPresenceP03TerraceTest/module.php').read_text(encoding='utf-8')
          required=[
            "&& $this->ReadAttributeBoolean('Streaming');",
            "P03 PRODUKTIV – 3-Kamera-Fallback, CrossLine-Richtung noch lernend",
            "MotionDetect-Readback nach Aktivierung nicht eindeutig TRUE",
            "if ($human === null)",
            "if ($auditOnly) {",
            "$this->ResetTest();"
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing hardened P03 contracts: '+repr(missing))
          audit=s[s.index("public function PrepareAndStartTest"):s.index("private function rollbackPreparedP03Config")]
          if audit.index("if ($auditOnly) {") > audit.index("$this->ResetTest();"):
              raise SystemExit('Audit-only guard does not protect field evidence')
          print('P03 hardened module contract PASS')
          PY
