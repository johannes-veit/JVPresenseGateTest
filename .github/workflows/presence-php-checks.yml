name: Presence PHP regressions

on:
  push:
    paths:
      - 'JVPresenceIdentityShadow/**'
      - 'libs/**'
      - 'tests/**'
      - 'library.json'
      - '.github/workflows/presence-php-checks.yml'
  pull_request:
    paths:
      - 'JVPresenceIdentityShadow/**'
      - 'libs/**'
      - 'tests/**'
      - 'library.json'
      - '.github/workflows/presence-php-checks.yml'

permissions:
  contents: read

jobs:
  php-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP runtime
        run: php -v && php -m | grep -i mbstring
      - name: Syntax check relevant modules
        run: |
          php -l JVPresenceIdentityShadow/module.php
          php -l libs/JVShadowStateCheckpoint.php
          php -l libs/JVResidentEventFusion.php
          php -l libs/JVRouteEpisodeLedger.php
          php -l libs/JVResidentJourneyEvidence.php
          php -l libs/JVPresenceEvidenceReadiness.php
          php -l libs/JVResidentArrivalInference.php
          php -l libs/JVResidentDepartureInference.php
          php -l libs/JVResidentTileDashboard.php
          php -l libs/JVResidentEveningHandoff.php
          php -l libs/JVPhoneContactContinuity.php
      - name: Regression simulations
        run: |
          php tests/JVResidentEventFusionTest.php
          php tests/JVRouteEpisodeLedgerTest.php
          php tests/JVResidentJourneyEvidenceTest.php
          php tests/JVPresenceEvidenceReadinessTest.php
          php tests/JVResidentDepartureInferenceTest.php
          php tests/JVResidentArrivalInferenceTest.php
          php tests/JVPhoneContactContinuityTest.php
          php tests/JVResidentTileDashboardTest.php
          php tests/JVResidentEveningHandoffTest.php
          php tests/JVCombinedPresenceBooleanTest.php
      - name: Complete repository standalone PHP regression sweep
        run: |
          set -euo pipefail
          n=0
          for test in tests/*Test.php tests/test_logic.php; do
            echo "::group::$test"
            php -d auto_prepend_file=tests/MockSymconSemaphore.php "$test"
            echo "::endgroup::"
            n=$((n+1))
          done
          echo "Full regression suite passed ($n standalone test files)"
